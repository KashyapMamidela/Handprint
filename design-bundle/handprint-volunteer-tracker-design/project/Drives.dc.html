<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#0d0f10;color:#f5f1e8;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
    a{text-decoration:none}
  </style>
</helmet>

<div style="background:#0d0f10;min-height:100vh">

  <header style="height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;background:rgba(13,15,16,0.85);backdrop-filter:blur(16px);z-index:50">
    <a href="Landing.dc.html" style="display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#e8c766,#d4af37);box-shadow:0 4px 12px -4px rgba(212,175,55,0.5)"></div>
      <span style="font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:#f5f1e8">Handprint</span>
    </a>
    <nav style="display:flex;gap:32px;align-items:center">
      <a href="Dashboard.dc.html" style="color:#9c9791;font-size:15px;font-weight:600">Dashboard</a>
      <a href="Drives.dc.html" style="color:#e8c766;font-size:15px;font-weight:700">Drives</a>
      <a href="Leaderboard.dc.html" style="color:#9c9791;font-size:15px;font-weight:600">Leaderboard</a>
      <a href="AdminQueue.dc.html" style="color:#9c9791;font-size:15px;font-weight:600">Admin</a>
    </nav>
    <div style="width:40px;height:40px;border-radius:50%;background:#d4af37;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#14120a">SR</div>
  </header>

  <div style="max-width:1200px;margin:0 auto;padding:48px 48px 96px">
    <h1 style="font-family:'Fraunces',serif;font-size:32px;font-weight:600;margin:0 0 8px">Open drives</h1>
    <p style="font-size:15px;color:#9c9791;margin:0 0 40px">Find a drive, show up, and log your hours when you're done.</p>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;perspective:1200px">
      <sc-for list="{{ drives }}" as="d" hint-placeholder-count="6">
        <div ref="{{ getCardRef }}" style="background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px -24px rgba(0,0,0,0.6);transition:transform 0.12s ease-out,box-shadow 0.12s ease-out">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;font-weight:700;letter-spacing:0.04em;color:#6b6862;text-transform:uppercase">{{ d.org }}</span>
            <span style="font-size:12px;font-weight:700;color:#e8c766;background:rgba(212,175,55,0.12);padding:4px 10px;border-radius:999px">{{ d.hours }}</span>
          </div>
          <h3 style="font-size:18px;font-weight:700;color:#f5f1e8;margin:0">{{ d.name }}</h3>
          <p style="font-size:14px;line-height:1.6;color:#a8a29b;margin:0;flex:1">{{ d.desc }}</p>
          <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)">
            <div>
              <div style="font-size:13px;color:#f5f1e8;font-weight:600">{{ d.date }}</div>
              <div style="font-size:12px;color:#6b6862;margin-top:2px">{{ d.spots }} spots open</div>
            </div>
            <a href="Dashboard.dc.html" style="height:38px;padding:0 18px;border-radius:9px;background:linear-gradient(135deg,#e8c766,#d4af37);color:#14120a;font-size:13px;font-weight:700;display:flex;align-items:center">Log Hours</a>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { drives: null };
  async componentDidMount() {
    const mod = await import('./data.js');
    this.setState({ drives: mod.drives });
  }
  getCardRef = (el) => {
    if (!el) return;
    this._attached = this._attached || new WeakSet();
    if (this._attached.has(el)) return;
    this._attached.add(el);
    el.addEventListener('mousemove', (e) => {
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `perspective(900px) rotateX(${(-py * 9).toFixed(2)}deg) rotateY(${(px * 9).toFixed(2)}deg) translateY(-4px)`;
      el.style.boxShadow = '0 30px 50px -20px rgba(0,0,0,0.7)';
    });
    el.addEventListener('mouseleave', () => {
      el.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg) translateY(0px)';
      el.style.boxShadow = '0 20px 40px -24px rgba(0,0,0,0.6)';
    });
  };
  renderVals() {
    return { drives: this.state.drives || [], getCardRef: this.getCardRef };
  }
}

</script>
</body>
</html>

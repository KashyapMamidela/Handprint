<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#0d0f10;color:#f5f1e8;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:#e8c766}
    a:hover{color:#f3d98a}
    input::placeholder{color:#5c5952}
  </style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px;position:relative;background:radial-gradient(ellipse 900px 500px at 50% -10%,rgba(212,175,55,0.08),transparent)">

  <a href="Landing.dc.html" style="position:absolute;top:40px;left:48px;display:flex;align-items:center;gap:10px;color:#f5f1e8">
    <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#e8c766,#d4af37)"></div>
    <span style="font-family:'Fraunces',serif;font-size:18px;font-weight:600">Handprint</span>
  </a>

  <div style="width:400px;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:40px;box-shadow:0 30px 60px -30px rgba(0,0,0,0.7)">
    <h1 style="font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin:0 0 8px;text-align:center">{{ heading }}</h1>
    <p style="font-size:14px;color:#9c9791;margin:0 0 32px;text-align:center">{{ subheading }}</p>

    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px">
      <button style="height:48px;border-radius:10px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03);color:#f5f1e8;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer">
        <span style="width:18px;height:18px;border-radius:50%;background:conic-gradient(from 0deg,#e8c766,#59c2a4,#c98f5c,#e8c766)"></span>
        Continue with Google Workspace
      </button>
      <button style="height:48px;border-radius:10px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03);color:#f5f1e8;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer">
        <span style="width:18px;height:18px;border-radius:4px;background:linear-gradient(135deg,#59c2a4,#3fa588)"></span>
        Continue with campus SSO
      </button>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div>
      <span style="font-size:12px;color:#6b6862">or with email</span>
      <div style="flex:1;height:1px;background:rgba(255,255,255,0.1)"></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="font-size:13px;font-weight:600;color:#a8a29b;display:block;margin-bottom:6px">School email</label>
        <input type="email" placeholder="you@university.edu" style="width:100%;height:48px;border-radius:10px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03);color:#f5f1e8;font-size:14px;padding:0 14px;box-sizing:border-box;font-family:'Manrope',sans-serif"/>
      </div>
      <div>
        <label style="font-size:13px;font-weight:600;color:#a8a29b;display:block;margin-bottom:6px">Password</label>
        <input type="password" placeholder="••••••••" style="width:100%;height:48px;border-radius:10px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03);color:#f5f1e8;font-size:14px;padding:0 14px;box-sizing:border-box;font-family:'Manrope',sans-serif"/>
      </div>
      <a href="Dashboard.dc.html" style="height:48px;border-radius:10px;background:linear-gradient(135deg,#e8c766,#d4af37);color:#14120a;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 24px -8px rgba(212,175,55,0.45);margin-top:8px">{{ ctaLabel }}</a>
    </div>

    <p style="text-align:center;font-size:13px;color:#9c9791;margin:24px 0 0">
      {{ switchPrompt }} <a href="#" onClick="{{ toggleMode }}" style="font-weight:700">{{ switchAction }}</a>
    </p>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: 'login' };
  renderVals() {
    const isLogin = this.state.mode === 'login';
    return {
      heading: isLogin ? 'Welcome back' : 'Create your account',
      subheading: isLogin ? 'Sign in to keep tracking your impact.' : 'Start logging hours that actually count.',
      ctaLabel: isLogin ? 'Sign in' : 'Create account',
      switchPrompt: isLogin ? "Don't have an account?" : 'Already have an account?',
      switchAction: isLogin ? 'Sign up' : 'Sign in',
      toggleMode: (e) => { e.preventDefault(); this.setState({ mode: isLogin ? 'signup' : 'login' }); }
    };
  }
}

</script>
</body>
</html>
